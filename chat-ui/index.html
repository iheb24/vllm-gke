<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vLLM-GKE Tier Test Chat</title>
<style>
  :root { --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #e6edf3; --dim: #8b949e; --cpu: #3fb950; --gpu: #d29922; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
  header { padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--border); }
  header h1 { margin: 0 0 10px; font-size: 16px; }
  .settings { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .settings input, .settings select { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font-size: 13px; }
  .settings input#baseUrl { width: 240px; }
  .settings input#apiKey { width: 340px; }
  .settings button { background: #238636; color: #fff; border: 0; border-radius: 6px; padding: 6px 14px; cursor: pointer; font-size: 13px; }
  #status { font-size: 12px; color: var(--dim); margin-left: auto; }
  #status.err { color: #f85149; }
  #status.ok { color: var(--cpu); }
  #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 78%; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; line-height: 1.45; font-size: 14px; }
  .msg.user { align-self: flex-end; background: #1f6feb; }
  .msg.bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); }
  .msg .meta { display: flex; gap: 8px; align-items: center; margin-top: 8px; font-size: 11px; color: var(--dim); }
  .badge { padding: 2px 8px; border-radius: 10px; font-weight: 600; font-size: 11px; }
  .badge.cpu { background: rgba(63,185,80,.15); color: var(--cpu); border: 1px solid var(--cpu); }
  .badge.gpu { background: rgba(210,153,34,.15); color: var(--gpu); border: 1px solid var(--gpu); }
  #composer { display: flex; gap: 8px; padding: 12px 16px; background: var(--panel); border-top: 1px solid var(--border); }
  #input { flex: 1; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 14px; resize: none; }
  #send { background: #1f6feb; color: #fff; border: 0; border-radius: 8px; padding: 0 20px; cursor: pointer; font-size: 14px; }
  #send:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header>
  <h1>vLLM-GKE tier test chat</h1>
  <div class="settings">
    <input id="baseUrl" placeholder="http://localhost:8081/v1">
    <input id="apiKey" type="password" placeholder="API key">
    <select id="model">
      <option value="auto">auto (router decides)</option>
      <option value="qwen3-4b-cpu">qwen3-4b-cpu (force small)</option>
      <option value="Qwen/Qwen2.5-Coder-14B-Instruct-AWQ">Qwen 14B (force big)</option>
    </select>
    <button id="saveSettings">Save settings</button>
    <span id="status"></span>
  </div>
</header>
<div id="chat"></div>
<form id="composer">
  <textarea id="input" rows="2" placeholder="Type a message… (Enter to send, Shift+Enter for newline)"></textarea>
  <button id="send" type="submit">Send</button>
</form>
<script>
const $ = id => document.getElementById(id);
const chat = $("chat");

function loadSettings() {
  const q = new URLSearchParams(location.search);
  $("baseUrl").value = q.get("url") || localStorage.getItem("baseUrl") || (location.origin + "/v1");
  $("apiKey").value = q.get("key") || localStorage.getItem("apiKey") || "";
  $("model").value = q.get("model") || localStorage.getItem("model") || "auto";
}
$("saveSettings").onclick = () => {
  localStorage.setItem("baseUrl", $("baseUrl").value.trim());
  localStorage.setItem("apiKey", $("apiKey").value.trim());
  localStorage.setItem("model", $("model").value);
  setStatus("settings saved", "ok");
};
function setStatus(t, cls) { const s = $("status"); s.textContent = t; s.className = cls || ""; }

function addMsg(role) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  const body = document.createElement("span");
  div.appendChild(body);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}
function addBadge(div, modelName, elapsedMs) {
  const meta = document.createElement("div");
  meta.className = "meta";
  const isGpu = /14B/i.test(modelName);
  const badge = document.createElement("span");
  badge.className = "badge " + (isGpu ? "gpu" : "cpu");
  badge.textContent = isGpu ? "GPU tier" : "CPU tier";
  meta.appendChild(badge);
  const detail = document.createElement("span");
  detail.textContent = modelName + (elapsedMs != null ? " · " + (elapsedMs/1000).toFixed(1) + "s" : "");
  meta.appendChild(detail);
  div.appendChild(meta);
  chat.scrollTop = chat.scrollHeight;
}

$("input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("composer").requestSubmit(); }
});

$("composer").addEventListener("submit", async e => {
  e.preventDefault();
  const text = $("input").value.trim();
  if (!text) return;
  const baseUrl = $("baseUrl").value.trim().replace(/\/+$/, "");
  const apiKey = $("apiKey").value.trim();
  const model = $("model").value;
  if (!apiKey) { setStatus("enter the API key first", "err"); return; }

  addMsg("user").firstChild.textContent = text;
  $("input").value = "";
  $("send").disabled = true;
  const bot = addMsg("bot");
  bot.firstChild.textContent = "…";
  const t0 = performance.now();
  let modelSeen = null;

  try {
    const resp = await fetch(baseUrl + "/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + apiKey },
      body: JSON.stringify({ model, messages: [{ role: "user", content: text }], stream: true })
    });
    if (!resp.ok) throw new Error("HTTP " + resp.status + " — " + (await resp.text()).slice(0, 300));

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "", answer = "";
    bot.firstChild.textContent = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.startsWith("data:")) continue;
        const payload = line.slice(5).trim();
        if (payload === "[DONE]") continue;
        try {
          const chunk = JSON.parse(payload);
          if (!modelSeen && chunk.model) {
            modelSeen = chunk.model;
            addBadge(bot, modelSeen, null);
          }
          const delta = chunk.choices && chunk.choices[0] && chunk.choices[0].delta;
          if (delta && delta.content) {
            answer += delta.content;
            bot.firstChild.textContent = answer;
            chat.scrollTop = chat.scrollHeight;
          }
        } catch (_) {}
      }
    }
    if (!modelSeen) addBadge(bot, "unknown", null);
    bot.querySelector(".meta span:last-child").textContent =
      modelSeen + " · " + ((performance.now() - t0) / 1000).toFixed(1) + "s";
    setStatus("", "");
  } catch (err) {
    bot.firstChild.textContent = "Error: " + err.message;
    setStatus(err.message, "err");
  } finally {
    $("send").disabled = false;
    $("input").focus();
  }
});

loadSettings();
</script>
</body>
</html>
