apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: rag
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: retrieval
        static_configs:
          - targets: ["retrieval.rag.svc.cluster.local:8090"]
      - job_name: embed-tei
        static_configs:
          - targets: ["embed-tei.rag.svc.cluster.local:8080"]
      - job_name: rerank-tei
        static_configs:
          - targets: ["rerank-tei.rag.svc.cluster.local:8080"]
      - job_name: qdrant
        metrics_path: /metrics
        scheme: http
        static_configs:
          - targets: ["qdrant.rag.svc.cluster.local:6333"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: rag
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      nodeSelector:
        workload: rag
      containers:
        - name: prometheus
          image: "prom/prometheus:v3.5.0"
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.retention.time=7d"
            - "--storage.tsdb.path=/prometheus"
          ports:
            - name: http
              containerPort: 9090
          resources:
            requests:
              cpu: "50m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: rag
spec:
  type: ClusterIP
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
