apiVersion: apps/v1
kind: Deployment
metadata:
  name: embed-tei
  namespace: rag
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: embed-tei
  template:
    metadata:
      labels:
        app: embed-tei
    spec:
      nodeSelector:
        workload: rag
      containers:
        - name: tei
          image: "ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4"
          args:
            - "--model-id"
            - "onnx-community/Qwen3-Embedding-0.6B-ONNX"
            - "--port"
            - "8080"
            - "--max-batch-tokens"
            - "1024"
            - "--max-client-batch-size"
            - "128"
            - "--pooling"
            - "last-token"
            - "--api-key"
            - "$(EMBED_API_KEY)"
          env:
            - name: EMBED_API_KEY
              valueFrom:
                secretKeyRef:
                  name: embed-apikey
                  key: api-key
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: embed-tei
  namespace: rag
spec:
  type: ClusterIP
  selector:
    app: embed-tei
  ports:
    - name: http
      port: 8080
      targetPort: 8080
