apiVersion: apps/v1
kind: Deployment
metadata:
  name: retrieval
  namespace: rag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: retrieval
  template:
    metadata:
      labels:
        app: retrieval
    spec:
      nodeSelector:
        workload: rag
      containers:
        - name: retrieval
          image: "REGION-docker.pkg.dev/YOUR_PROJECT_ID/rag/retrieval:latest"
          env:
            - name: QDRANT_URL
              value: "http://qdrant.rag.svc.cluster.local:6333"
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: qdrant-key
                  key: api-key
            - name: QDRANT_COLLECTION
              value: "docs-v1"
            - name: EMBED_URL
              value: "http://embed-tei.rag.svc.cluster.local:8080"
            - name: EMBED_API_KEY
              valueFrom:
                secretKeyRef:
                  name: embed-apikey
                  key: api-key
            - name: GATEWAY_URL
              value: "http://envoy-vllm-semantic-router-34deec5c.envoy-gateway-system.svc.cluster.local:80"
            - name: GATEWAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vllm-api-key
                  key: api-key
            - name: GATEWAY_MODEL
              value: "qwen3-4b-cpu"
          ports:
            - containerPort: 8090
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: retrieval
  namespace: rag
spec:
  type: ClusterIP
  selector:
    app: retrieval
  ports:
    - name: http
      port: 8090
      targetPort: 8090
