apiVersion: v1
kind: ServiceAccount
metadata:
  name: ingestion
  namespace: rag
  annotations:
    iam.gke.io/gcp-service-account: rag-ingest-sa@YOUR_PROJECT_ID.iam.gserviceaccount.com
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ingest
  namespace: rag
spec:
  schedule: "17 4 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: ingest
        spec:
          serviceAccountName: ingestion
          nodeSelector:
            workload: rag
          restartPolicy: Never
          containers:
            - name: ingest
              image: "REGION-docker.pkg.dev/YOUR_PROJECT_ID/rag/ingest:latest"
              env:
                - name: GCS_BUCKET
                  value: "YOUR_RAG_DOCS_BUCKET"
                - name: GCS_PREFIX
                  value: ""
                - name: QDRANT_URL
                  value: "http://qdrant.rag.svc.cluster.local:6333"
                - name: QDRANT_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: qdrant-key
                      key: api-key
                - name: QDRANT_COLLECTION
                  value: "docs-v2"
                - name: EMBED_URL
                  value: "http://embed-tei.rag.svc.cluster.local:8080"
                - name: EMBED_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: embed-apikey
                      key: api-key
              resources:
                requests:
                  cpu: "500m"
                  memory: "2Gi"
                limits:
                  cpu: "2"
                  memory: "4Gi"
