config:
  version: v0.3
  listeners: []
  providers:
    defaults:
      model: Qwen/Qwen2.5-Coder-14B-Instruct-AWQ
      reasoning_effort: low
    models:
      - name: Qwen/Qwen2.5-Coder-14B-Instruct-AWQ
        backend_refs:
          - name: gpu-vllm
            provider: vllm
            endpoint: keda-add-ons-http-interceptor-proxy.keda.svc.cluster.local:8080
            weight: 1
      - name: qwen3-4b-cpu
        backend_refs:
          - name: slm-cpu
            provider: vllm
            endpoint: slm-service.vllm.svc.cluster.local:8080
            weight: 1
  routing:
    decisions:
      - name: code_agentic
        description: Agentic or non-trivial code work, always escalates to the GPU tier
        priority: 30
        rules:
          operator: OR
          conditions:
            - type: domain
              name: computer science
            - type: domain
              name: engineering
            - type: keyword
              name: agentic
        modelRefs:
          - model: Qwen/Qwen2.5-Coder-14B-Instruct-AWQ
            use_reasoning: false
      - name: technical_complex
        description: Hard STEM domains escalate to the GPU tier
        priority: 20
        rules:
          operator: OR
          conditions:
            - type: domain
              name: math
            - type: domain
              name: physics
            - type: domain
              name: chemistry
            - type: domain
              name: biology
        modelRefs:
          - model: Qwen/Qwen2.5-Coder-14B-Instruct-AWQ
            use_reasoning: false
      - name: chat_casual
        description: Casual conversation and general knowledge served by the CPU tier
        priority: 10
        rules:
          operator: OR
          conditions:
            - type: domain
              name: other
            - type: domain
              name: psychology
            - type: domain
              name: history
            - type: domain
              name: philosophy
            - type: domain
              name: business
            - type: domain
              name: economics
            - type: domain
              name: health
            - type: domain
              name: law
        modelRefs:
          - model: qwen3-4b-cpu
            use_reasoning: false
    signals:
      keywords:
        - name: agentic
          operator: OR
          keywords:
            - refactor
            - debug
            - codebase
            - repository
            - across files
            - implement
            - architecture
            - optimize
            - schema
            - migration
            - migrations
            - database
            - sql
            - docker
            - kubernetes
            - function
            - script
            - api
            - pytest
            - deploy
          case_sensitive: false
      domains:
        - name: business
          description: Business, corporate strategy, management, finance, marketing
        - name: law
          description: Legal principles, case law, statutory interpretation, legal procedures
        - name: psychology
          description: Cognitive processes, behavioral patterns, mental health, developmental psychology
        - name: biology
          description: Molecular biology, genetics, cell biology, ecology, evolution, anatomy
        - name: chemistry
          description: Chemical reactions, molecular structures, laboratory techniques
        - name: history
          description: Historical events, time periods, cultures, civilizations
        - name: health
          description: Anatomy, physiology, diseases, treatments, preventive care, nutrition
        - name: economics
          description: Microeconomics, macroeconomics, financial markets, monetary policy, trade
        - name: math
          description: Mathematics, algebra, calculus, geometry, statistics
        - name: physics
          description: Physical laws, mechanics, thermodynamics, electromagnetism, quantum physics
        - name: computer science
          description: Algorithms, data structures, programming, software engineering
        - name: philosophy
          description: Philosophical traditions, ethics, logic, metaphysics, epistemology
        - name: engineering
          description: Engineering disciplines, design, problem-solving, systems
        - name: other
          description: General knowledge and miscellaneous topics
    modelCards:
      - name: Qwen/Qwen2.5-Coder-14B-Instruct-AWQ
      - name: qwen3-4b-cpu
  global:
    router:
      strategy: priority
    services:
      response_api:
        enabled: false
      router_replay:
        store_backend: memory
        ttl_seconds: 2592000
        async_writes: false
    stores:
      response_cache:
        enabled: false
    integrations:
      tools:
        enabled: false
