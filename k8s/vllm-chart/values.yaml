namespace: vllm

serviceAccount:
  create: true
  name: "vllm-ksa"
  # This should match your GCP project ID
  projectId: "YOUR_PROJECT_ID"

pvc:
  create: true
  name: "vllm-cache-pvc"
  size: "50Gi"
  storageClass: "standard-rwo"

model:
  name: "Qwen/Qwen2.5-Coder-14B-Instruct-AWQ"
  quantization: "awq"
  maxModelLen: "32768"
  gpuMemoryUtilization: "0.95"

image:
  repository: "vllm/vllm-openai"
  tag: "latest"

proxy:
  image:
    repository: "us-central1-docker.pkg.dev/YOUR_PROJECT_ID/vllm-repo/vllm-proxy"
    tag: "latest"

datadog:
  secretName: "datadog-keda-auth"
  apiKey: "YOUR_DATADOG_API_KEY"
  appKey: "YOUR_DATADOG_APP_KEY"

scaling:
  enabled: true
  minReplicas: 0
  maxReplicas: 1
  # How long KEDA waits before scaling down after the proxy active requests drops to 0
  scaledownPeriod: 300
