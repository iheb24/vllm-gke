namespace: vllm

serviceAccount:
  create: true
  name: "vllm-ksa"
  projectId: "project-c4f86d90-75ff-4766-8cd"

pvc:
  create: true
  name: "vllm-cache-pvc"
  size: "50Gi"
  storageClass: "standard-rwo"

model:
  name: "Qwen/Qwen2.5-Coder-14B-Instruct-AWQ"
  quantization: "awq"
  maxModelLen: "32768"
  gpuMemoryUtilization: "0.95"

image:
  repository: "vllm/vllm-openai"
  tag: "latest"

proxy:
  image:
    repository: "us-central1-docker.pkg.dev/project-c4f86d90-75ff-4766-8cd/vllm-repo/vllm-proxy"
    tag: "latest"

datadog:
  secretName: "datadog-keda-auth"
  # Keys will be injected via helm --set at deploy time
  apiKey: ""
  appKey: ""
  site: "datadoghq.eu"

scaling:
  enabled: true
  minReplicas: 0
  maxReplicas: 1
  scaledownPeriod: 300
