namespace: vllm

serviceAccount:
  create: true
  name: "vllm-ksa"
  # This should match your GCP project ID
  projectId: "YOUR_PROJECT_ID"

pvc:
  create: true
  name: "vllm-cache-pvc"
  size: "50Gi"
  storageClass: "standard-rwo"

model:
  name: "Qwen/Qwen2.5-Coder-14B-Instruct-AWQ"
  quantization: "awq"
  maxModelLen: "32768"
  gpuMemoryUtilization: "0.95"

image:
  repository: "vllm/vllm-openai"
  tag: "latest"

scaling:
  enabled: true
  minReplicas: 0
  maxReplicas: 1
  # How long KEDA waits before scaling down after the last request finishes (in seconds)
  scaledownPeriod: 300
  # targetPendingRequests determines when to scale up. 1 means any pending request scales it up.
  targetPendingRequests: 1

slm:
  enabled: true
  image:
    repository: "ghcr.io/ggml-org/llama.cpp"
    tag: "server"
  hfRepo: "Qwen/Qwen3-4B-GGUF"
  hfFile: "Qwen3-4B-Q4_K_M.gguf"
  ctxSize: "8192"
  threads: "3"
  resources:
    requests:
      cpu: "750m"
      memory: "4Gi"
    limits:
      cpu: "3"
      memory: "6Gi"
