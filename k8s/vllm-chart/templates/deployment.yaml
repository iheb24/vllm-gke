apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-server
  namespace: {{ .Values.namespace }}
spec:
  {{- if not .Values.scaling.enabled }}
  replicas: 1
  {{- end }}
  selector:
    matchLabels:
      app: vllm-server
  template:
    metadata:
      labels:
        app: vllm-server
      annotations:
        ad.datadoghq.com/vllm.checks: |
          {
            "openmetrics": {
              "instances": [
                {
                  "openmetrics_endpoint": "http://%%host%%:8000/metrics",
                  "metrics": [".*"]
                }
              ]
            }
          }
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-l4
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: vllm
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
          args:
            - "--model={{ .Values.model.name }}"
            - "--quantization={{ .Values.model.quantization }}"
            - "--max-model-len={{ .Values.model.maxModelLen }}"
            - "--gpu-memory-utilization={{ .Values.model.gpuMemoryUtilization }}"
            - "--enforce-eager"
          env:
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vllm-api-key
                  key: api-key
          ports:
            - containerPort: 8000
          resources:
            limits:
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: cache-volume
              mountPath: /root/.cache/huggingface
          # We need readiness/liveness probes so the HTTP Addon knows when traffic can flow
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: cache-volume
          persistentVolumeClaim:
            claimName: {{ .Values.pvc.name }}
